name: Build Binaries

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: Fylorra-Windows-x64
            binary: dist/Fylorra.exe
          - name: Linux x64
            os: ubuntu-latest
            artifact: Fylorra-Linux-x64
            binary: dist/Fylorra
          - name: macOS Apple Silicon
            os: macos-15
            artifact: Fylorra-macOS-arm64
            binary: dist/Fylorra
          - name: macOS Intel
            os: macos-15-intel
            artifact: Fylorra-macOS-x64
            binary: dist/Fylorra

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Compile check
        run: python -m py_compile main_qt.py qt_app/main_window.py qt_app/backend.py core/device_transfer.py utils/notification_manager.py

      - name: Smoke tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest tests.test_ai_stability -v

      - name: Build with PyInstaller
        run: pyinstaller --clean --noconfirm Fylorra.spec

      - name: Verify binary exists
        shell: bash
        run: test -e "${{ matrix.binary }}"

      - name: Packaged AI dialog smoke tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/packaged_ai_smoke.py "${{ matrix.binary }}"

      - name: Package Windows portable artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path "${{ matrix.binary }}" -DestinationPath "release/${{ matrix.artifact }}.zip" -Force

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build Windows setup installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if ($version -notmatch '^v?\d+\.\d+\.\d+$') {
            $version = "0.0.0"
          }
          $version = $version.TrimStart("v")
          python installer/create_installer_assets.py
          Push-Location installer
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" "/DVERSION=$version" FylorraInstaller.nsi
          Pop-Location

      - name: Package Unix artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p release
          tar -czf "release/${{ matrix.artifact }}.tar.gz" -C dist Fylorra

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p upload
          find release-assets -type f -name 'Fylorra-*' -exec cp '{}' upload/ ';'
          ls -la upload

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" upload/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Fylorra ${GITHUB_REF_NAME}" \
            --notes "Cross-platform Fylorra desktop builds for Windows x64, Linux x64, macOS Apple Silicon, and macOS Intel. Windows includes both a portable zip and a branded setup installer." \
            --latest
